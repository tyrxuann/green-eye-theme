name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CJK font (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Build
        run: uv run green_eye.py build

      - name: Assert tracked files unchanged by build
        run: git diff --exit-code

      - name: Test
        run: uv run green_eye.py test

      - name: Package
        run: uv run green_eye.py package

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: green-eye-${{ runner.os }}
          path: release/*.zip
          if-no-files-found: error
