name: CI

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CJK font (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Build
        run: uv run green_eye.py build

      - name: Build VS Code
        run: uv run green_eye.py vscode

      - name: CVD variants
        run: uv run green_eye.py cvd-variants

      - name: Assert tracked files unchanged by build
        run: git diff --exit-code

      - name: Test
        run: uv run green_eye.py test

      - name: Doctor
        run: uv run green_eye.py doctor --json > doctor-${{ runner.os }}.json

      - name: Package
        run: uv run green_eye.py package --all

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: green-eye-${{ runner.os }}
          path: |
            release/*.zip
            vscode/dist/*.vsix
            doctor-*.json
          if-no-files-found: error
